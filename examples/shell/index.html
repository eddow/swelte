<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Theme boot: stored pref wins, else OS. Inline + blocking so it runs
      before first paint — src/app.ts is a deferred module and can only
      re-apply after paint (flash). Keep THEME_KEY in sync with
      src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem('swelte-shell-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        /* private mode — default theme stands */
      }
    </script>
    <title>Swelte — shell</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/.swelte/entry-main.ts"></script>
  </body>
</html>
